name: "branch Coverage"

on:
  push:
    tags: [ '*' ]
    branches: [ 'develop', 'main' ]
  pull_request:
    branches: [ 'develop', 'main' ]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [ 8.4, 8.5 ]
        laravel: [ "12.*" ]
        stability: [ prefer-stable ]
        include:
          - laravel: 12.*
            laravel_label: "12"
            testbench: 10.*
            carbon: 3.*
            collision: 8.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare test environment
        uses: ./.github/actions/prepare-tests
        with:
          php-version: ${{ matrix.php }}
          laravel: ${{ matrix.laravel }}
          testbench: ${{ matrix.testbench }}
          carbon: ${{ matrix.carbon }}
          stability: ${{ matrix.stability }}

      - name: Execute tests
        run: vendor/bin/paratest --coverage-clover=coverage/clover.xml --coverage-html=report

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: clover-coverage-${{ matrix.laravel_label }}-${{ matrix.php }}
          path: coverage/clover.xml

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report-${{ matrix.laravel_label }}-${{ matrix.php }}
          path: report/

      - name: Send coverage to Qlty
        if: success()
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/clover.xml
